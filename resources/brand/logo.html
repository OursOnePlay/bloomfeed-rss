<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>BloomFeed logo</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { width: 1000px; height: 240px; display: flex; align-items: center; gap: 38px; padding: 20px 28px; color: #25291f; }
.mark { width: 180px; height: 180px; position: relative; flex-shrink: 0; }
.petal { position: absolute; width: 42px; height: 72px; top: 0; left: 69px; background: #efbb38; border-radius: 24px 24px 9px 9px; transform-origin: 21px 90px; transform: rotate(calc(var(--i) * 45deg)); }
.seed { position: absolute; inset: 45px; background: #25291f; border: 8px solid #fff; border-radius: 50%; }
.seed::before, .seed::after { content: ''; position: absolute; border-radius: 50%; background: #efbb38; width: 12px; height: 12px; top: 18px; left: 18px; }
.seed::after { top: 37px; left: 37px; }
.name { font: 700 116px/1 Arial, Helvetica, sans-serif; letter-spacing: -6px; }
.dark { color: #f2f2e9; }
.dark .seed { border-color: #161815; }
.icon { width: 240px; padding: 30px; }
.icon .name { display: none; }
</style>
<div class="mark" aria-hidden="true">
  <div class="petal" style="--i:0"></div><div class="petal" style="--i:1"></div>
  <div class="petal" style="--i:2"></div><div class="petal" style="--i:3"></div>
  <div class="petal" style="--i:4"></div><div class="petal" style="--i:5"></div>
  <div class="petal" style="--i:6"></div><div class="petal" style="--i:7"></div>
  <div class="seed"></div>
</div>
<div class="name">BloomFeed</div>
</html>
